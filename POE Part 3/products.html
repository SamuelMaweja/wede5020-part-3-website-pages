<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="Mpiana Samuel Maweja">
    <meta name="description" content="Explore VillaSerenita's Italian menu.">
    <meta name="keywords" content="reservations, delivery, events">

    <title>Courses</title>

    <link rel="stylesheet" href="styles.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap"
          rel="stylesheet">
</head>

<body>

    <header>
        <h1 class="page-title">Our Menu</h1>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="enquiries.html">Help</a></li>
                <li><a href="contacts.html">Contact Information</a></li>
                <li><a href="products.html" aria-current="page">Courses</a></li>
            </ul>
        </nav>
    </header>

    <main class="products-container">

        <!-- Search and sorting section -->
        <section class="product-controls">

            <h2>Explore Our Menu</h2>

            <!-- Search bar -->
            <input
                type="search"
                id="search-input"
                placeholder="Search for a dish..."
                aria-label="Search menu products"
            >

            <!-- Sorting options -->
            <select id="sort-products" aria-label="Sort products">

                <option value="default">Default Menu Order</option>

                <option value="name-asc">Name (A-Z)</option>

                <option value="price-asc">
                    Price (Lowest to Highest)
                </option>

                <option value="price-desc">
                    Price (Highest to Lowest)
                </option>

            </select>

        </section>

        <!-- Dynamically loaded products -->
        <div id="product-list">

            <!-- JavaScript displays products here -->

        </div>

        <!-- Message displayed when no products match -->
        <p id="no-results" hidden>
            Sorry, no products match your search.
        </p>

    </main>

    <!-- JavaScript product listings, searching and sorting -->
    <script src="js/products.js"></script>

</body>
</html>
