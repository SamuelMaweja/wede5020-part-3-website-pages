    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap');

        /* Used a grid for its two-dimensional control */
        body {
            margin: 0;
            background-color: black;
            color: white;
            font-family: 'Fredoka', sans-serif;

            display: grid;
            grid-template-rows: auto 1fr auto;
            min-height: 100vh;
        }

        /* Css to structure the header */
        header {
            display: grid;
            justify-items: center;
            text-align: center;
            padding: 2rem;
            width: 100%;
            box-sizing: border-box;
        }

        /* Css to make the logo be on the top and center of the screen */
        header img {
            display: block;
            margin: 0 auto 1.25rem auto;
            width: 45%;
            height: auto;
            max-width: 350px;
            object-fit: contain;
            grid-row: 1;
        }

        /* Css specifically for the image on home screen */
        header img[src="Restaurant.jpg"] {
            grid-row: 3;
            width: 80%;
            height: auto;
            max-width: 800px;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border: 0.2em solid gold;
            border-radius: 0.6rem;
            margin: 1.25rem auto 1.875rem auto;
            box-shadow: 0 0 1.25rem gold;
        }

        /* Flexbox used to display the navigation in a one-dimensional row */
        nav {
            width: 100%;
            display: flex;
            justify-content: center;
            grid-row: 2;
            margin-bottom: 1.25rem;
        }

        nav ul {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5em;
            list-style: none;
            padding: 0;
            margin: 0;
            width: 100%;
        }

        /* Css for the navigation options */
        nav a {
            color: gold;
            text-decoration: none;
            font-size: 1.125rem;
            font-weight: 500;
            padding: 0.6em 0.85em;
            border-radius: 0.3em;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Css to show the user that they are hovering over a navigation option */
        nav a:hover {
            background-color: blue;
            color: white;
        }

        /* Css for the main section */
        main {
            display: grid;
            align-items: center;
            justify-items: center;
            padding: 2.5rem;
            width: 100%;
            box-sizing: border-box;
        }

        /* Css to display the footer in a grid */
        footer {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2em;
            padding: 1.5rem;
            border-top: 0.0625rem solid gold;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        footer section {
            display: grid;
            gap: 0.6em;
        }

        footer li {
            list-style: none;
            color: white;
            font-size: 1rem;
        }

        /* Responsive design for tablets */
        @media (max-width: 60em) {

            header {
                padding: 1.5rem;
            }

            header img {
                width: 50%;
            }

            header img[src="Restaurant.jpg"] {
                width: 90%;
            }

            nav ul {
                gap: 1em;
            }

            nav a {
                font-size: 1rem;
            }

            main {
                padding: 2rem;
            }

            footer {
                gap: 1.5em;
            }
        }

        /* Responsive design for phones */
        @media (max-width: 40em) {

            header {
                padding: 1rem;
            }

            header img {
                width: 70%;
            }

            header img[src="Restaurant.jpg"] {
                width: 100%;
                margin: 1rem auto 1.5rem auto;
            }

            nav ul {
                flex-direction: column;
                gap: 0.5em;
            }

            nav a {
                display: block;
                font-size: 1rem;
                padding: 0.6em 1em;
            }

            main {
                padding: 1.5rem;
            }

            footer {
                grid-template-columns: 1fr;
                gap: 1em;
                padding: 1.25rem;
            }
        }
    </style>
</head>
