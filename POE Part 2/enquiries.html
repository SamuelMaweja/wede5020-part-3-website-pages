<!DOCTYPE html>
<html lang="en">
<head>
<body>    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Mpiana Samuel Maweja">
    <meta name="description" content="describe the business">
    <meta name="keywords" content="reservations, delivery, events">
    <link rel="stylesheet"
     href="styles.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap');

        body {
            margin: 0;
            background-color: black;
            color: white;
            font-family: 'Fredoka', sans-serif;

            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
            box-sizing: border-box;
        }

       
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 2rem;
            width: 100%;
            box-sizing: border-box;
        }

       
        header h1 {
            color: gold;
            font-size: 2.2rem;
            margin-bottom: 2rem;
        }

      
        nav {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        nav ul {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5em;
            list-style: none;
            padding: 0;
            margin: 0;
            width: 100%;
        }

       
        nav a {
            color: gold;
            text-decoration: none;
            font-size: 1.125rem;
            font-weight: 500;
            padding: 0.6em 0.9em;
            border-radius: 0.3em;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        
        nav a:hover {
            background-color: blue;
            color: white;
        }

        
        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 1.25em;
            flex: 1;
            padding: 3.125rem 5%;
            width: 100%;
            box-sizing: border-box;
        }

        /* The main question */
        main p {
            color: gold;
            font-size: 1.875rem;
            margin: 0;
            width: 100%;
            max-width: 50rem;
        }

        /* Further information */
        main p2 {
            color: white;
            font-size: 1.25rem;
            line-height: 1.6;
            width: 100%;
        }

        /* List containing the information */
        main li {
            list-style: none;
            width: 80%;
            max-width: 43.75rem;
            padding: 1.25rem;
            border: 0.125em solid gold;
            border-radius: 0.6rem;
            box-sizing: border-box;
        }

       
        footer {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.875rem;
            border-top: 0.0625rem solid gold;
            min-height: 3.125rem;
            width: 100%;
            box-sizing: border-box;
        }

        /* Responsive design for tablets */
        @media (max-width: 60em) {

            header {
                padding: 1.5rem;
            }

            header h1 {
                font-size: 2rem;
                margin-bottom: 1.5rem;
            }

            nav ul {
                gap: 1em;
            }

            nav a {
                font-size: 1rem;
                padding: 0.6em 0.8em;
            }

            main {
                padding: 2.5rem 5%;
            }

            main p {
                font-size: 1.6rem;
            }

            main p2 {
                font-size: 1.1rem;
            }

            main li {
                width: 85%;
            }

            footer {
                padding: 1.5rem;
            }
        }

        /* Responsive design for smaller screens */
        @media (max-width: 40em) {

            header {
                padding: 1rem;
            }

            header h1 {
                font-size: 1.7rem;
                margin-bottom: 1.5rem;
            }

            nav ul {
                flex-direction: column;
                gap: 0.5em;
            }

            nav a {
                display: block;
                font-size: 1rem;
                padding: 0.6em 1em;
            }

            main {
                padding: 2rem 1rem;
                gap: 1em;
            }

            main p {
                font-size: 1.4rem;
                width: 95%;
            }

            main p2 {
                font-size: 1rem;
                line-height: 1.5;
            }

            main li {
                width: 95%;
                padding: 1rem;
            }

            footer {
                padding: 1.25rem 1rem;
                min-height: 2.5rem;
            }
        }
    </style>
</head>

    <title>Enquiries</title>

     <header> 
        <h1>Founded in 2015</h1>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html ">About Us</a></li> 
                <li><a href="enquiries.html"> Help</a></li>  
                <li><a href="contacts.html ">Contact information</a></li> 
                <li><a href="products.html"> Courses</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <p>What would you like to know</p>
        <li><p2>Enter Enquiry Here</p2></li>
    </main>

    <footer>
         
</body>  
</html>
