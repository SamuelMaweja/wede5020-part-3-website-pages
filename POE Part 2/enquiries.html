    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap');

        body {
            margin: 0;
            background-color: black;
            color: white;
            font-family: 'Fredoka', sans-serif;

            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

       
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

       
        header h1 {
            color: gold;
            font-size: 35px;
            margin-bottom: 30px;
        }

      
        nav {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        nav ul {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

       
        nav a {
            color: gold;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        
        nav a:hover {
            background-color: blue;
            color: white;
        }

        
        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 20px;
            flex: 1;
            padding: 50px;
        }

        /* The main question */
        main p {
            color: gold;
            font-size: 30px;
            margin: 0;
        }

        /* Further information */
        main p2 {
            color: white;
            font-size: 20px;
            line-height: 1.6;
        }

        /* List containing the information */
        main li {
            list-style: none;
            max-width: 700px;
            padding: 20px;
            border: 2px solid gold;
            border-radius: 10px;
        }

       
        footer {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            border-top: 1px solid gold;
            min-height: 50px;
        }
    </style>
